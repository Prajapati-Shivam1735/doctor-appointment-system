{% extends 'booking/home.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-primary">Patient Login</h3>
                    <p class="text-muted small">Enter your phone & password</p>
                </div>

                {% if messages %}
                    {% for msg in messages %}
                        <div class="alert alert-danger py-2 small">{{ msg }}</div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Phone Number</label>
                        <input type="text" name="phone" class="form-control" required placeholder="Registered phone number">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">Login</button>
                </form>

                <div class="text-center mt-3 small">
                    Don't have an account? <a href="/patient/register/" class="text-primary fw-semibold text-decoration-none">Sign up</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
