<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DocPulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fcfcfc;
            color: #414146;
        }

        .auth-nav-tabs {
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 40px;
            padding: 15px 40px 0;
            background: #fff;
        }

        .auth-tab-link {
            text-decoration: none;
            color: #414146;
            font-weight: 600;
            font-size: 16px;
            padding-bottom: 12px;
            border-bottom: 3px solid transparent;
            display: inline-block;
        }

        .auth-tab-link.active {
            color: #28328c;
            border-bottom: 3px solid #14bef0;
        }

        .practo-card {
            background: #ffffff;
            border: 1px solid #f0f0f5;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            border-radius: 4px;
            width: 100%;
            max-width: 440px;
        }

        .practo-card-header {
            padding: 18px 24px;
            border-bottom: 1px solid #f0f0f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .practo-card-header h5 {
            font-weight: 700;
            color: #414146;
            margin: 0;
            font-size: 17px;
        }

        .practo-card-body {
            padding: 24px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #787887;
            margin-bottom: 6px;
        }

        .form-control {
            border-radius: 4px;
            border: 1px solid #dcdce6;
            padding: 10px 14px;
            font-size: 14px;
            color: #414146;
        }

        .form-control:focus {
            border-color: #14bef0;
            box-shadow: 0 0 0 1px #14bef0;
        }

        .btn-practo {
            background-color: #14bef0;
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            padding: 12px;
            border-radius: 4px;
            border: none;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .btn-practo:hover {
            background-color: #0ea7d4;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Top Tabs -->
    <div class="auth-nav-tabs">
        <a href="/patient/login/" class="auth-tab-link active">Login</a>
        <a href="/patient/register/" class="auth-tab-link">Register</a>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center align-items-center">
            
            <div class="col-lg-5 d-none d-lg-flex flex-column align-items-center text-center pe-lg-5">
                <i class="fa-solid fa-hospital-user" style="font-size: 160px; color: #e0f2fe; margin-bottom: 24px;"></i>
                <h4 class="fw-bold text-dark">Welcome Back to DocPulse</h4>
                <p class="text-muted small">Manage your upcoming appointments and healthcare history seamlessly.</p>
            </div>

            <div class="col-lg-5 col-md-8 d-flex justify-content-center">
                <div class="practo-card">
                    
                    <div class="practo-card-header">
                        <h5>Patient Login</h5>
                    </div>

                    <div class="practo-card-body">
                        {% if messages %}
                            {% for msg in messages %}
                                <div class="alert alert-danger py-2 small mb-3">{{ msg }}</div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Mobile Number</label>
                                <input type="tel" name="phone" class="form-control" placeholder="Mobile Number" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Password" required>
                            </div>

                            <button type="submit" class="btn btn-practo">Login</button>
                        </form>

                        <div class="text-center mt-3 small">
                            Don't have an account? <a href="/patient/register/" style="color: #14bef0; text-decoration: none; font-weight: 600;">Register here</a>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

</body>
</html>
