<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reschedule Appointment | DocPulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="card shadow border-0 rounded-4 p-4" style="max-width: 480px; width: 100%;">
    <h4 class="fw-bold mb-2">Reschedule Slot</h4>
    <p class="text-muted small">Doctor: <strong>Dr. {{ appointment.doctor.name }}</strong> ({{ appointment.doctor.department.name }})</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger py-2 small">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label small fw-semibold">New Date</label>
            <input type="date" name="appointment_date" value="{{ appointment.appointment_date|date:'Y-m-d' }}" class="form-control rounded-3" required>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-semibold">New Time</label>
            <input type="time" name="appointment_time" value="{{ appointment.appointment_time|time:'H:i' }}" class="form-control rounded-3" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 rounded-3 py-2 fw-semibold">Save New Time</button>
        <a href="/track/?q={{ appointment.patient_phone }}" class="btn btn-link w-100 text-muted small mt-2">Back to Appointments</a>
    </form>
</div>

</body>
</html>
